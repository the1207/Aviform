spring.application.name=Aviform
server.port=${SERVER_PORT:8080}
jwt.secret=${JWT_SECRET:12345678901234567890123456789012}

# Configuration PostgreSQL (par défaut en local, configurable via variables d'environnement)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestnutri}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration Supabase (si vous souhaitez utiliser Supabase, vérifiez que le projet n'est pas en pause)
